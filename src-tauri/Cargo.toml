[package]
name = "spotron"
version = "0.1.0"
description = "Player Spotify para Windows com DSP (CamillaDSP) e UI própria"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls usa o repositório de certificados do Windows (o accounts.spotify.com usa a CA
# "Certainly", que o Windows baixa sob demanda).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
# Cliente WebSocket (síncrono) para o CamillaDSP.
tungstenite = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
