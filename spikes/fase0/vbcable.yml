---
# Fase 0 / Spike B: app (Web Playback SDK) -> "CABLE Input" -> VB-CABLE -> CamillaDSP 4.1.3 -> fones.
# Campos conferidos no código-fonte do CamillaDSP v4.1.3 (src/config/mod.rs, backend_wasapi.md).
#
# - WASAPI shared: `samplerate` precisa ser IGUAL ao "Formato padrão" de CADA dispositivo
#   (CABLE Output e fones). Hoje os fones Realtek estão em 48000 Hz; pôr o VB-CABLE em 48000 Hz também.
# - Captura e playback são relógios diferentes (cabo virtual x placa): o rate adjust corrige o desvio.
#   No Windows ele só age via resampler assíncrono (o Synchronous ignora o ajuste).
title: "Fase 0 - Spike B (VB-CABLE)"
devices:
  samplerate: 48000
  capture_samplerate: 48000
  chunksize: 1024
  queuelimit: 4
  enable_rate_adjust: true
  target_level: 1024
  adjust_period: 10
  resampler:
    type: AsyncSinc
    profile: Balanced
  silence_threshold: -100
  silence_timeout: 3.0
  capture:
    type: Wasapi
    channels: 2
    device: "CABLE Output (VB-Audio Virtual Cable)"
    format: F32         # shared mode é sempre F32
    exclusive: false
    loopback: false
  playback:
    type: Wasapi
    channels: 2
    device: null        # null = dispositivo padrão (hoje "Fones de ouvido (Realtek(R) Audio)")
    format: F32
    exclusive: false

filters:
  preamp:
    type: Gain
    parameters:
      gain: -6.0        # headroom para o EQ não clipar
      scale: dB
  # Filtro "óbvio" do critério de aceite: passa-baixa em 500 Hz (o ws_test.py alterna com 20 kHz).
  lowpass_test:
    type: Biquad
    parameters:
      type: Lowpass
      freq: 500
      q: 0.707
  # Banda que o ws_test.py varre em tempo real.
  peq_test:
    type: Biquad
    parameters:
      type: Peaking
      freq: 1000
      gain: 0.0
      q: 1.0
  limiter:
    type: Limiter
    parameters:
      clip_limit: -0.1
      soft_clip: false

pipeline:
  - type: Filter
    description: "EQ de teste"
    channels: [0, 1]
    names:
      - preamp
      - lowpass_test
      - peq_test
      - limiter
